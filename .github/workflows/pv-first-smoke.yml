name: PV-first candidate smoke test
on:
  push:
    branches: [experiment/pv-first-20261121]
  workflow_dispatch:
jobs:
  pv-first:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check 4KB, syntax, and deterministic legal moves
        run: |
          python -m pip install 'python-chess==1.999'
          cp main.py /tmp/tiny_chess_candidate.py
          python - <<'PY'
          import ast,pathlib
          p=pathlib.Path('main.py')
          print('candidate_bytes',p.stat().st_size)
          assert p.stat().st_size<=4096
          ast.parse(p.read_text())
          PY
          python tools/test_candidate_rules.py
