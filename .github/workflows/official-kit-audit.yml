name: Official Tiny Chess kit audit
on:
  pull_request:
    paths:
      - '.github/workflows/official-kit-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect official competition kit
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 https://make.fun/c/tiny-chess-01/kit -o /tmp/tiny-kit.tar.gz
          mkdir -p /tmp/tiny-kit
          tar -xzf /tmp/tiny-kit.tar.gz -C /tmp/tiny-kit
          find /tmp/tiny-kit -type f | sort > official-kit-files.txt
          echo 'OFFICIAL KIT CONTENTS:'
          cat official-kit-files.txt
          find /tmp/tiny-kit -type f \( -iname '*sunfish*' -o -name 'main.py' \) -print > official-house-path.txt
          HOUSE="$(head -1 official-house-path.txt)"
          if [ -z "$HOUSE" ] || [ ! -f "$HOUSE" ]; then
            echo 'BLOCK: kit extracted but no Sunfish/main.py candidate found; inspect official-kit-files.txt artifact'
            exit 2
          fi
          cp "$HOUSE" official-house-main.py
          cp /tmp/tiny-kit/tiny-chess-01-kit/RULES.txt official-RULES.txt
          cp /tmp/tiny-kit/tiny-chess-01-kit/program/generator/calibration.json official-calibration.json
          cp /tmp/tiny-kit/tiny-chess-01-kit/program/scorer/score.mjs official-score.mjs
          cp /tmp/tiny-kit/tiny-chess-01-kit/program/env/server.mjs official-server.mjs
          cp /tmp/tiny-kit/tiny-chess-01-kit/kit.json official-kit.json
          tar tzf /tmp/tiny-kit/tiny-chess-01-kit/harness/harness-src.tar.gz > official-harness-files.txt
          echo 'NESTED HARNESS FILES:'
          cat official-harness-files.txt
          python - <<'PY'
          import pathlib,ast,hashlib,json
          p=pathlib.Path('official-house-main.py')
          data=p.read_bytes()
          print('house_main_bytes',len(data),'sha256',hashlib.sha256(data).hexdigest())
          assert len(data)<=4096
          ast.parse(data.decode())
          print('STARTER ONLY parsed; no Sunfish house engine exists in outer kit. Inspect nested harness separately.')
          PY
          grep -Ei 'RULES.txt|kit.json|agent/sunfish-4k|generator|calibration|practice|protocol|scorer' official-kit-files.txt | head -150
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-tiny-chess-kit-audit
          path: |
            official-kit-files.txt
            official-house-path.txt
            official-house-main.py
            official-RULES.txt
            official-calibration.json
            official-score.mjs
            official-server.mjs
            official-kit.json
            official-harness-files.txt
