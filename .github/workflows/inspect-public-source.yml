name: Inspect Xyzar29 decompressed engine for single targeted improvement
on:
  push:
    branches: [experiment/public-engine-reproduction-20261122]
    paths: ['.github/workflows/inspect-public-source.yml']
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public engine and print decompressed source
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 https://raw.githubusercontent.com/Xyzar29/tiny-chess/main/main.py -o /tmp/main.py
          python - <<'PY'
          import ast,lzma,pathlib,hashlib
          p=pathlib.Path('/tmp/main.py')
          src=p.read_bytes().decode('latin-1')
          print('PUBLIC_SOURCE_SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          print('RAW_PREFIX',repr(p.read_bytes()[:180]))
          tree=ast.parse(src)
          print('AST_PREFIX',ast.dump(tree,include_attributes=False)[:700])
          for node in ast.walk(tree):
           if isinstance(node,ast.Call) and isinstance(node.func,ast.Attribute) and node.func.attr=='decompress':
            for arg in node.args:
   print('DECOMPRESS_ARG',ast.dump(arg,include_attributes=False)[:400])
             try:
              v=ast.literal_eval(arg)
              if isinstance(v,str):v=v.encode('latin-1')
              if isinstance(v,(bytes,bytearray)):
               unpack=lzma.decompress(v).decode()
               print('UNPACKED_SOURCE_BEGIN',len(unpack.encode()))
               for i,line in enumerate(unpack.splitlines(),1):print(f'{i:03d}: {line}')
               print('UNPACKED_SOURCE_END')
               raise SystemExit(0)
             except (ValueError,TypeError,lzma.LZMAError):pass
          print('WRAPPER',src[:500])
          raise SystemExit(2)
          PY
