name: Quality Gate
on:
  pull_request:
    paths:
      - 'engine.py'
      - 'main.py'
      - 'tests/**'
      - '.github/workflows/quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run checks
        run: |
          python -m unittest discover -s tests -v
          python - <<'PY'
          from pathlib import Path
          print('Development engine bytes:', len(Path('engine.py').read_bytes()))
          if Path('main.py').exists():
              n=len(Path('main.py').read_bytes())
              print('Competition main.py bytes:', n)
              assert n<=4096, 'Competition main.py exceeds 4096 bytes'
          PY
