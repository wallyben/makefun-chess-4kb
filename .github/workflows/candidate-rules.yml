name: Candidate chess rules regression
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  rules:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        candidate: [submission-minimal, experiment/check-evasion-depth-20261121, experiment/pv-first-20261121]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'python-chess==1.999'
      - name: Fetch exact candidate
        run: git fetch origin '${{ matrix.candidate }}' && git show 'FETCH_HEAD:main.py' > /tmp/tiny_chess_candidate.py
      - name: Check special moves and king safety
        run: python tools/test_candidate_rules.py
