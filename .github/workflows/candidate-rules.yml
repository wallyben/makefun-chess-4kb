name: Candidate chess rules regression
on:
  pull_request:
    paths:
      - 'tools/test_candidate_rules.py'
      - '.github/workflows/candidate-rules.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rules:
    strategy:
      fail-fast: false
      matrix:
        candidate: [submission-minimal, experiment/alphabeta-20261121, experiment/fixed-node-20261121, experiment/fixed-node-deeper-20261121, experiment/ordered-search-20261121, experiment/capture-order-20261121, experiment/nodes-25000-20261121, experiment/mate-terminal-20261121, experiment/phase-eval-20261121, experiment/nodes-30000-20261121, experiment/quiescence-20261121, experiment/standpat-20261121, experiment/check-aware-20261121, experiment/check-evasion-depth-20261121]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'python-chess==1.999'
      - name: Fetch exact candidate
        run: git fetch origin '${{ matrix.candidate }}' && git show 'FETCH_HEAD:main.py' > /tmp/tiny_chess_candidate.py
      - name: Check special moves and king safety
        run: python tools/test_candidate_rules.py
