name: Candidate chess rules regression
on:
  pull_request:
    paths:
      - 'tools/test_candidate_rules.py'
      - '.github/workflows/candidate-rules.yml'
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'python-chess==1.999'
      - name: Fetch exact candidate
        run: git fetch origin submission-minimal && git show origin/submission-minimal:main.py > /tmp/tiny_chess_candidate.py
      - name: Check special moves and king safety
        run: python tools/test_candidate_rules.py
