name: Official house practice G1
on:
  push:
    branches: [experiment/public-engine-reproduction-20261122]
    paths: ['.github/workflows/official-practice-g1.yml']
  workflow_dispatch:
jobs:
  practice:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Download exact official practice environment
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 https://make.fun/c/tiny-chess-01/kit -o /tmp/kit.tar.gz
          mkdir -p /tmp/kit
          tar -xzf /tmp/kit.tar.gz -C /tmp/kit
          K=/tmp/kit/tiny-chess-01-kit
          mkdir -p /tmp/gauntlet /tmp/chess-state
          cp "$K/practice/trial-0/input/env/gauntlet.json" /tmp/gauntlet/gauntlet.json
          curl -fLsS --retry 3 https://raw.githubusercontent.com/Xyzar29/tiny-chess/main/main.py -o main.py
          python - <<'PY'
          import ast,lzma,pathlib,hashlib
          p=pathlib.Path('main.py');original=p.read_bytes()
          tree=ast.parse(original.decode('latin1'))
          calls=[n for n in ast.walk(tree) if isinstance(n,ast.Call) and isinstance(n.func,ast.Attribute) and n.func.attr=='decompress']
          assert len(calls)==1
          arg=calls[0].args[0]
          raw=ast.literal_eval(arg.func.value).encode('latin1')
          source=lzma.decompress(raw).decode('utf8')
          assert source.count('BG=120000')==1
          modified=source.replace('BG=120000','BG=180000')
          assert modified!=source
          blob=lzma.compress(modified.encode('utf8'),format=lzma.FORMAT_ALONE,preset=9)
          esc={k:chr(92)+v for k,v in [(0,'0'),(10,'n'),(13,'r'),(39,chr(39)),(92,chr(92))]}
          escaped=''.join(esc.get(ord(c),c) for c in blob.decode('latin1'))
          packed=b'#coding:l1\nimport lzma;exec(lzma.decompress('+ ("'"+escaped+"'").encode('latin1')+b".encode('l1')))\n"
          assert len(packed)<=4096, f'OVER_CAP={len(packed)}'
          compile(packed,'main.py','exec')
          p.write_bytes(packed)
          print('SINGLE_EXPERIMENT=BG 120000 -> 180000 (50% more deterministic search nodes)')
          print('UPSTREAM_SHA256',hashlib.sha256(original).hexdigest(),'CHALLENGER_SHA256',hashlib.sha256(packed).hexdigest(),'BYTES',len(packed))
          print('EXACT_UNPACKED_DIFF','- BG=120000','+ BG=180000')
          PY
          curl -fLsS --retry 3 https://raw.githubusercontent.com/Xyzar29/tiny-chess/main/LICENSE -o public-engine-LICENSE
          grep -qi "MIT License" public-engine-LICENSE
          echo "G5_SINGLE_CHALLENGER=Xyzar29 derivative, BG 180000, MIT attribution required; experimental only"
          git rev-parse HEAD
          python - <<'PY'
          from pathlib import Path
          p=Path('main.py')
          assert p.stat().st_size<=4096
          compile(p.read_bytes(),str(p),'exec')
          print('ENTRY_SHA256',__import__('hashlib').sha256(p.read_bytes()).hexdigest(),'BYTES',p.stat().st_size)
          PY
          echo "OFFICIAL_SERVER=$K/program/env/server.mjs" >> "$GITHUB_ENV"
      - name: Score single higher-node-budget derivative against official gauntlet
        shell: bash
        run: |
          set -euo pipefail
          MAKEFUN_ENV_DATA_DIR=/tmp/gauntlet MAKEFUN_STATE_DIR=/tmp/chess-state MAKEFUN_ENV_PORT=18080 node "$OFFICIAL_SERVER" > official-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if [ -f /tmp/chess-state/ready ]; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat official-server.log; exit 1; fi
            sleep 0.5
          done
          test -f /tmp/chess-state/ready
          cat /tmp/chess-state/ready
          MAKEFUN_ENV_URL=http://127.0.0.1:18080 timeout 1780s python main.py > official-entry.log 2>&1 || echo "ENTRY_EXIT_CODE=$?" | tee entry-exit.txt
          echo 'POST-ENTRY SERVER LIFECYCLE'
          if kill -0 "$server_pid" 2>/dev/null; then
            echo 'SERVER_ALIVE_AFTER_ENTRY=1'
            kill -TERM "$server_pid" 2>/dev/null || true
            for i in $(seq 1 30); do
              if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
              sleep 0.2
            done
            wait "$server_pid" 2>/dev/null || true
          else
            echo 'SERVER_ALIVE_AFTER_ENTRY=0'
          fi
          echo 'EXPORT_AFTER_SERVER_SHUTDOWN'
          find /tmp/chess-state -maxdepth 4 -type f -printf '%p %s bytes\\n' | sort
          cp /tmp/chess-state/calls.ndjson official-calls.ndjson 2>/dev/null || true
          echo 'ENTRY LOG'; tail -35 official-entry.log || true
          echo 'SERVER LOG'; tail -80 official-server.log || true
          echo 'STATE FILES'; find /tmp/chess-state -maxdepth 4 -type f -printf '%p %s bytes\n' | sort | head -100
          echo 'CALL TRACE SUMMARY'; python - <<'PY'
          import json,pathlib,collections
          p=pathlib.Path('official-calls.ndjson')
          if p.exists():
           lines=p.read_text().splitlines(); print('CALL_COUNT',len(lines))
           for line in (lines[:2]+lines[-8:]):
            try: print(json.dumps(json.loads(line))[:1100])
            except Exception: print(line[:1100])
          PY
          echo 'STATE JSON CANDIDATES'; find /tmp/chess-state -maxdepth 4 -type f \( -name '*.json' -o -name '*.ndjson' \) -print | head -30
          python - <<'PY'
          import json,pathlib,collections
          p=pathlib.Path('/tmp/chess-state/export/state.json')
          if not p.exists():print('BLOCK: no official state export; inspect server log and state-file inventory above');raise SystemExit(2)
          s=json.loads(p.read_text());print('OFFICIAL_STATE',json.dumps(s)[:15000])
          print('RESULT_TYPES',type(s).__name__)
          PY
          cp /tmp/chess-state/export/state.json official-state.json
          cp /tmp/chess-state/export/transcript.ndjson official-transcript.ndjson
          cp /tmp/chess-state/calls.ndjson official-calls.ndjson
      - name: Execute bundled official scorer on exported six-game state
        shell: bash
        run: |
          set -euo pipefail
          K=/tmp/kit/tiny-chess-01-kit
          echo 'OFFICIAL_SCORER_INPUT_CONTRACT'
          sed -n '898,925p' "$K/program/scorer/score.mjs"
          echo 'OFFICIAL_GAUNTLET_REFERENCE'
          find "$K/practice/trial-0" -maxdepth 5 -type f -print | sort
          mkdir -p /tmp/official-scores
          MAKEFUN_OUTPUT_DIR=/tmp/chess-state/export MAKEFUN_REFERENCE_DIR="$K/practice/trial-0/reference" MAKEFUN_SCORES_DIR=/tmp/official-scores node "$K/program/scorer/score.mjs"
          test -s /tmp/official-scores/scores.json
          cp /tmp/official-scores/scores.json official-scores.json
          python - <<'PY'
          import json
          s=json.load(open('official-scores.json'))
          print('OFFICIAL_SCORER_OUTPUT',json.dumps(s,sort_keys=True))
          assert isinstance(s.get('elo'),(int,float))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-practice-g1-evidence
          path: |
            official-state.json
            official-scores.json
            official-transcript.ndjson
            official-calls.ndjson
            official-entry.log
            public-engine-LICENSE
            official-replay-state.json
            official-replay-entry.log
            official-replay-server.log
            official-server.log
            entry-exit.txt
