name: Submission candidate smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: submission-minimal
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate candidate size, syntax and chess invariants
        run: |
          python - <<'PY'
          import pathlib,ast,os
          p=pathlib.Path('main.py')
          assert p.stat().st_size<=4096,p.stat().st_size
          files=[f for f in pathlib.Path('.').rglob('*') if f.is_file() and '.git' not in f.parts]
          assert sum(f.stat().st_size for f in files)<=8192
          assert all(f.stat().st_size<=4096 for f in files)
          ast.parse(p.read_text())
          os.environ['MAKEFUN_ENV_URL']='http://127.0.0.1:1'
          import main
          start='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1'
          b=main.board(start)
          assert len(b)==64
          assert len(list(main.replies(b,True)))==20
          assert len(list(main.replies(b,False)))==20
          assert main.move(b,'e2e4')[main.sq('e4')]=='P'
          assert main.move(b,'e2e4')[main.sq('e2')]=='.'
          # Pawn legality: no diagonal non-captures or forward captures.
          empty='4k3/8/8/8/8/8/4P3/4K3 w - - 0 1'
          b=main.board(empty)
          dest={i for n in main.replies(b,True) for i in range(64) if n[i]=='P' and b[i]!='P'}
          assert dest=={main.sq('e3'),main.sq('e4')},dest
          blocked='4k3/8/8/8/8/4p3/4P3/4K3 w - - 0 1'
          b=main.board(blocked)
          assert not any(n[main.sq('e3')]=='P' for n in main.replies(b,True))
          capture='4k3/8/8/8/8/3p4/4P3/4K3 w - - 0 1'
          b=main.board(capture)
          assert any(n[main.sq('d3')]=='P' for n in main.replies(b,True))
          assert not any(n[main.sq('f3')]=='P' for n in main.replies(b,True))
          print('Candidate smoke checks passed')
          PY
      - name: Exercise actual HTTP game protocol and move timeout
        run: |
          python - <<'PY'
          import os,subprocess,sys,threading,json,time
          from http.server import BaseHTTPRequestHandler,ThreadingHTTPServer
          moves=[]
          class Handler(BaseHTTPRequestHandler):
              def log_message(self,*args):pass
              def do_POST(self):
                  length=int(self.headers.get('Content-Length','0'))
                  data=json.loads(self.rfile.read(length))
                  if self.path=='/game':
                      payload={'status':'your_move','game':'smoke','fen':'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1','legal_moves':['e2e4','d2d4','g1f3']}
                  elif self.path=='/move':
                      moves.append(data)
                      payload={'status':'done'}
                  else:
                      self.send_error(404);return
                  body=json.dumps(payload).encode()
                  self.send_response(200);self.send_header('Content-Type','application/json');self.send_header('Content-Length',str(len(body)));self.end_headers();self.wfile.write(body)
          server=ThreadingHTTPServer(('127.0.0.1',0),Handler)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          env=dict(os.environ,MAKEFUN_ENV_URL=f'http://127.0.0.1:{server.server_port}')
          try:
              start=time.monotonic()
              p=subprocess.run([sys.executable,'main.py'],env=env,capture_output=True,text=True,timeout=10)
              elapsed=time.monotonic()-start
              assert p.returncode==0,(p.returncode,p.stdout,p.stderr)
              assert len(moves)==1,moves
              assert moves[0]['game']=='smoke',moves
              assert moves[0]['move'] in ('e2e4','d2d4','g1f3'),moves
              print(f'HTTP game/move smoke passed in {elapsed:.3f}s')
          finally:
              server.shutdown()
          PY
